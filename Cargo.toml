[package]
name = "edr-lite"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
ring = "0.17"
base64 = "0.22"
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
ferrisetw = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
