# edr-lite 설정 예시 (게스트 VM: C:\edr\agent.toml)
gcp_project_id = "edr-lab-123456"            # EDR 전용 GCP 프로젝트 ID (실제 값으로 교체)
sa_key_path    = 'C:\edr\sa-key.json'        # Logs Writer 역할만 가진 서비스 계정 키(JSON)
session_id     = "run-20261018-001"          # 분석 회차 ID. 모든 이벤트의 sid 가 된다

# 선택 항목 (기본값)
# log_name           = "lab_malware"   # Cloud Logging 로그 이름
# batch_max_events   = 500             # 범위 1~1000
# batch_max_bytes    = 524288
# flush_interval_ms  = 500             # 랜섬웨어 대비: 죽기 직전 로그까지 빨리 내보냄
# queue_capacity     = 50000
# heartbeat_secs     = 10              # 감시 Function 은 이 값의 3배 이상 끊기면 경보
# collect_image_loads = true
# collect_network     = true
# trace_name = "WindowsTelemetryService"   # 생략 시 회차마다 자동 생성
# wipe_sa_key = true        # 로드 직후 키 파일 삭제 (스냅샷 복원형 워크플로 전제)
