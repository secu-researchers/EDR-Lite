# edr-relay 설정 예시 (릴레이 VM)
server_cert     = "/etc/edr-relay/relay.pem"     # 서버 인증서 (에이전트의 핀과 일치해야 함)
server_key      = "/etc/edr-relay/relay.key"
ca_cert         = "/etc/edr-relay/ca.pem"        # 에이전트 인증서를 서명한 사설 CA
allowed_cn_file = "/etc/edr-relay/allowed_cn.txt" # 허용 회차(CN) 목록. 폐기 = 줄 삭제
spool_dir       = "/var/lib/edr-relay/spool"

# 선택 항목 (기본값)
# listen_host     = "0.0.0.0"   # 분석망 쪽 NIC 주소로 제한하는 것을 권장
# listen_port     = 8443
# log_name        = "edr-lite"
# max_body_bytes  = 4194304
# heartbeat_secs  = 10          # 에이전트의 heartbeat_secs 이상으로 설정
# spool_max_files = 100000
# dry_run         = false       # true 면 GCP 대신 stdout 출력 (검증용)

# GCP 인증: 환경변수 GOOGLE_APPLICATION_CREDENTIALS 에 서비스 계정 키 경로를 지정한다.
# 서비스 계정에는 Logs Writer 역할만 부여한다.
